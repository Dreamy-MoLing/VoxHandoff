name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_USER: agent_talk_ci
          POSTGRES_PASSWORD: agent_talk_ci_only
          POSTGRES_DB: agent_talk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_talk_ci -d agent_talk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check repository and types
        run: npm run check

      - name: Check protocol compatibility against the target branch
        if: github.event_name == 'pull_request'
        run: npm run protocol:breaking -- --against ".git#branch=origin/${{ github.base_ref }},subdir=packages/protocol/proto"

      - name: Run offline tests
        run: npm test

      - name: Run gRPC loopback transport tests
        env:
          AGENT_TALK_LOOPBACK_INTEGRATION: "1"
        run: npm run test:transport

      - name: Run PostgreSQL transaction tests
        env:
          AGENT_TALK_POSTGRES_URL: postgresql://agent_talk_ci:agent_talk_ci_only@127.0.0.1:5432/agent_talk_ci
        run: npm run test:postgres

  flutter-linux-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install Linux build and Secret Service dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
          libsqlite3-dev libkeybinder-3.0-dev libayatana-appindicator3-dev
          libnotify-dev dbus-x11 gnome-keyring xvfb ffmpeg pulseaudio-utils

      - name: Install pinned uv for the STT release sidecar
        run: |
          python3 -m pip install --disable-pip-version-check \
            --no-warn-script-location --prefix "$RUNNER_TEMP/uv" \
            uv==0.11.28
          test -x "$RUNNER_TEMP/uv/bin/uv"
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install Dart protocol dependencies
        working-directory: packages/protocol/dart
        run: flutter pub get

      - name: Install Flutter client dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Check generated Dart protocol bindings locally
        env:
          AGENT_TALK_FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: npm run protocol:check:dart

      - name: Run Flutter quality gate
        env:
          AGENT_TALK_FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: npm run flutter:check

      - name: Build bundled Linux STT executable
        env:
          VOXHANDOFF_STT_OUTPUT_DIR: ${{ github.workspace }}/artifacts/stt
        run: |
          export PATH="$RUNNER_TEMP/uv/bin:$PATH"
          command -v uv
          uv --version
          services/stt/scripts/build-linux.sh

      - name: Verify packaged STT fails closed without a model
        env:
          VOXHANDOFF_STT_EXECUTABLE: ${{ github.workspace }}/artifacts/stt/linux-x86_64/voxhandoff-stt
        run: |
          set +e
          "$VOXHANDOFF_STT_EXECUTABLE" --model "$RUNNER_TEMP/voxhandoff-no-model" </dev/null
          status=$?
          set -e
          test "$status" -eq 2

      - name: Configure Linux release with required STT bundle
        working-directory: apps/client
        env:
          VOXHANDOFF_STT_EXECUTABLE: ${{ github.workspace }}/artifacts/stt/linux-x86_64/voxhandoff-stt
        run: >-
          flutter build linux --release --config-only
          && cmake -S linux -B build/linux/x64/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVOXHANDOFF_STT_EXECUTABLE="$VOXHANDOFF_STT_EXECUTABLE"
          -DVOXHANDOFF_REQUIRE_STT_BUNDLE=ON

      - name: Build Linux release
        working-directory: apps/client
        run: flutter build linux --release

      - name: Verify bundled STT executable
        working-directory: apps/client
        run: test -x build/linux/x64/release/bundle/libexec/voxhandoff-stt

      - name: Exercise Linux desktop integration startup
        working-directory: apps/client
        run: >-
          dbus-run-session -- xvfb-run -a
          env VOXHANDOFF_DESKTOP_INTEGRATION_SELF_TEST=1
          VOXHANDOFF_DESKTOP_SELF_TEST_HEADLESS=1
          ./build/linux/x64/release/bundle/agent_talk_client

      - name: Exercise Linux Secret Service round trip
        working-directory: apps/client
        run: >-
          dbus-run-session -- bash -c
          'eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)";
          xvfb-run -a env VOXHANDOFF_SECURE_STORAGE_SELF_TEST=1
          ./build/linux/x64/release/bundle/agent_talk_client'

  flutter-platform-builds:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: apple
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install Dart dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Build Android debug APK
        if: matrix.platform == 'android'
        working-directory: apps/client
        run: flutter build apk --debug

      - name: Build macOS release
        if: matrix.platform == 'apple'
        working-directory: apps/client
        run: flutter build macos --release

      - name: Build iOS simulator app
        if: matrix.platform == 'apple'
        working-directory: apps/client
        run: flutter build ios --simulator --debug

      - name: Build Windows release
        if: matrix.platform == 'windows'
        working-directory: apps/client
        run: flutter build windows --release
