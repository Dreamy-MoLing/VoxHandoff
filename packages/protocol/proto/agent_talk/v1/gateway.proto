syntax = "proto3";

package agent_talk.v1;

import "agent_talk/v1/common.proto";
import "agent_talk/v1/control.proto";
import "agent_talk/v1/event.proto";

message ConnectClientRequest {
  oneof body {
    HandshakeOffer handshake = 1;
    Heartbeat heartbeat = 2;
    Ack ack = 3;
    ClientCommand command = 4;
    ProtocolError protocol_error = 5;
  }
}

message ConnectClientResponse {
  oneof body {
    HandshakeAccepted handshake = 1;
    Heartbeat heartbeat = 2;
    EventEnvelope event = 3;
    RequestStatus request_status = 4;
    ControlLease control_lease = 5;
    ProtocolError protocol_error = 6;
    ReplayCompleted replay_completed = 7;
    GatewayDirectory directory = 8;
    ConversationDescriptor conversation = 9;
  }
}

message NodeDescriptor {
  string node_id = 1;
  string display_name = 2;
  string platform = 3;
  string version = 4;
}

message AgentDescriptor {
  string agent_id = 1;
  string display_name = 2;
  string adapter = 3;
  string version = 4;
  string capability_revision = 5;
  AgentCapabilities capabilities = 6;
  string node_id = 7;
}

message ConversationDescriptor {
  string conversation_id = 1;
  string title = 2;
  string node_id = 3;
  string agent_id = 4;
  string capability_revision = 5;
  string session_id = 6;
  uint64 revision = 7;
  uint64 last_sequence = 8;
}

message GatewayDirectory {
  string command_id = 1;
  repeated NodeDescriptor nodes = 2;
  repeated AgentDescriptor agents = 3;
  repeated ConversationDescriptor conversations = 4;
}

message NodeRegistration {
  NodeDescriptor node = 1;
  repeated AgentDescriptor agents = 2;
}

message DispatchRequest {
  string dispatch_id = 1;
  string request_id = 2;
  string idempotency_key = 3;
  string conversation_id = 4;
  string session_id = 5;
  string node_id = 6;
  string agent_id = 7;
  string capability_revision = 8;
  string confirmed_text = 9;
}

message DispatchInterrupt {
  string dispatch_id = 1;
  string request_id = 2;
  string idempotency_key = 3;
}

message DispatchApproval {
  string dispatch_id = 1;
  string request_id = 2;
  string approval_id = 3;
  string idempotency_key = 4;
  ApprovalDecision decision = 5;
  string operation_summary_sha256 = 6;
}

message DispatchClarification {
  string dispatch_id = 1;
  string request_id = 2;
  string clarification_id = 3;
  string idempotency_key = 4;
  string confirmed_text = 5;
}

message DispatchAck {
  string dispatch_id = 1;
  string request_id = 2;
  bool accepted = 3;
  optional StageFailure failure = 4;
}

// Sent only after the Gateway durably accepts an EventEnvelope. A Node retains
// the frame across a transport reconnect until it receives this receipt, then
// may discard its in-memory retry record.
message NodeEventReceipt {
  string event_id = 1;
  string request_id = 2;
  string conversation_id = 3;
  uint64 source_sequence = 4;
  uint64 gateway_sequence = 5;
  bool duplicate = 6;
}

message ConnectNodeRequest {
  oneof body {
    HandshakeOffer handshake = 1;
    Heartbeat heartbeat = 2;
    NodeRegistration registration = 3;
    DispatchAck dispatch_ack = 4;
    EventEnvelope event = 5;
    ProtocolError protocol_error = 6;
  }
}

message ConnectNodeResponse {
  oneof body {
    HandshakeAccepted handshake = 1;
    Heartbeat heartbeat = 2;
    DispatchRequest dispatch_request = 3;
    DispatchInterrupt dispatch_interrupt = 4;
    DispatchApproval dispatch_approval = 5;
    DispatchClarification dispatch_clarification = 6;
    ProtocolError protocol_error = 7;
    NodeEventReceipt event_receipt = 8;
  }
}

service GatewayControlService {
  rpc ConnectClient(stream ConnectClientRequest) returns (stream ConnectClientResponse);
  rpc ConnectNode(stream ConnectNodeRequest) returns (stream ConnectNodeResponse);
}

message BeginPairingRequest {
  string device_display_name = 1;
  bytes device_public_key = 2;
  repeated string requested_scopes = 3;
  string expected_gateway_audience = 4;
}

message BeginPairingResponse {
  string pairing_id = 1;
  string user_code = 2;
  string verification_uri = 3;
  uint32 expires_in_seconds = 4;
  bytes device_proof_payload = 5;
  string device_fingerprint = 6;
  string gateway_fingerprint = 7;
  string gateway_audience = 8;
}

message CompletePairingRequest {
  string pairing_id = 1;
  // Deprecated pre-implementation placeholder. Gateways must not accept this
  // field as proof and clients must use device_key_proof instead.
  string device_proof = 2;
  DeviceSignature device_key_proof = 3;
}

message CompletePairingResponse {
  string device_id = 1;
  // Reserved for wire compatibility with the pre-implementation draft. Valid
  // credentials are returned only by ConfirmPairing.
  string access_token = 2;
  string refresh_token = 3;
  repeated string scopes = 4;
  string credential_id = 5;
  bytes confirmation_payload = 6;
  string gateway_audience = 7;
  uint32 confirmation_expires_in_seconds = 8;
}

message InspectPairingRequest {
  string user_code = 1;
}

message InspectPairingResponse {
  string pairing_id = 1;
  string device_display_name = 2;
  string device_fingerprint = 3;
  string gateway_fingerprint = 4;
  string gateway_audience = 5;
  repeated string requested_scopes = 6;
  uint32 expires_in_seconds = 7;
}

message ApprovePairingRequest {
  string pairing_id = 1;
  string user_code = 2;
  repeated string approved_scopes = 3;
  string expected_device_fingerprint = 4;
  string expected_gateway_fingerprint = 5;
  string expected_gateway_audience = 6;
  DeviceSignature administrator_signature = 7;
}

message ApprovePairingResponse {
  bool approved = 1;
  uint32 expires_in_seconds = 2;
}

message ConfirmPairingRequest {
  string pairing_id = 1;
  string credential_id = 2;
  DeviceSignature device_signature = 3;
}

message ConfirmPairingResponse {
  bool paired = 1;
  string device_id = 2;
  string credential_id = 3;
  string access_token = 4;
  string refresh_token = 5;
  repeated string scopes = 6;
  uint64 access_expires_at_unix_ms = 7;
  uint64 refresh_expires_at_unix_ms = 8;
  string gateway_audience = 9;
}

message RefreshDeviceCredentialRequest {
  string credential_id = 1;
  string refresh_token = 2;
  DeviceSignature device_signature = 3;
}

message RefreshDeviceCredentialResponse {
  string device_id = 1;
  string credential_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  repeated string scopes = 5;
  uint64 access_expires_at_unix_ms = 6;
  uint64 refresh_expires_at_unix_ms = 7;
  string gateway_audience = 8;
}

message RevokeDeviceRequest {
  string device_id = 1;
  string reason_code = 2;
  DeviceSignature administrator_signature = 3;
}

message RevokeDeviceResponse {
  bool revoked = 1;
}

service PairingService {
  rpc BeginPairing(BeginPairingRequest) returns (BeginPairingResponse);
  rpc InspectPairing(InspectPairingRequest) returns (InspectPairingResponse);
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);
  rpc CompletePairing(CompletePairingRequest) returns (CompletePairingResponse);
  rpc ConfirmPairing(ConfirmPairingRequest) returns (ConfirmPairingResponse);
  rpc RefreshDeviceCredential(RefreshDeviceCredentialRequest) returns (RefreshDeviceCredentialResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}
