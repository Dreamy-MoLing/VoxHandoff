name: agent_talk_client
description: Five-platform text and voice client for VoxHandoff.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  agent_talk_protocol:
    path: ../../packages/protocol/dart
  cryptography: ^2.9.0
  drift: ^2.34.2
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  grpc: ^5.1.0
  hotkey_manager: ^0.2.3
  local_notifier: ^0.1.6
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  mobile_scanner: 7.4.0
  path_provider: ^2.1.6
  record: 7.1.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/voxhandoff-tray.ico
    - assets/tray/voxhandoff-tray.png
  shaders:
    - shaders/signal_core.frag
