name: agent_talk_client
description: Five-platform text and voice client for Agent Talk.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  agent_talk_protocol:
    path: ../../packages/protocol/dart
  cryptography: ^2.9.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  grpc: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
